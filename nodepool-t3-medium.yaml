apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: t3-medium-pool
spec:
  template:
    spec:
      nodeClassRef:
        name: default
        kind: NodeClass
        group: eks.amazonaws.com
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.medium
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    budgets:
      - nodes: 10%
  limits:
    cpu: 4
    memory: 8Gi
